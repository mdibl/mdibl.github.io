site_name: MDIBL Comparative Genomics and Data Science Core 
site_url: https://mdibl.github.io/
nav:
  - Home: index.md
  - About:
    - Team: home/team.md
    - Contact: home/contact.md
  - Introduction to Data Science:
    - introDataScience/index.md
    - Data Organization in Spreadsheets: dataOrganization/index.md
    - Managing Data & Projects for Genomics: genomics/index.md
    - Introduction to R & RStudio: introR/index.md
    - Introduction to Data Visualization in R: dataViz/index.md
  - Introduction to Genomics Data Types: 
    - introDataTypes/index.md
    - Differential Gene Expression (Bulk RNAseq): bulkDGE/index.md
    - Single Cell RNAseq: scRNAseq/index.md
    - Spatial Transcriptomics: spatial/index.md
    - Computational Workflows: workflows/index.md
  - Bioinformatics Bits:
    - bits/index.md
    - Bit 1: bits/bit1.md
    - Bit 2: bits/bit2.md
  - Course Archives:
    - courseArchives/index.md
    - Introduction to Workflows in the Cloud 2025:
      - introToCloudCourse/index.md
      - Instructors: introToCloudCourse/instructors.md
      - Learning Resources: introToCloudCourse/learningResources.md
      - Arrival: introToCloudCourse/arrival.md
      - Sequin: introToCloudCourse/sequin.md
    - ScRNAseq in the Cloud:
      - courseArchives/scrnaseq2024/index.md
      - Instructors: courseArchives/scrnaseq2024/instructors.md
      - Learning Resources: courseArchives/scrnaseq2024/learning_resources.md
      - Arrival: courseArchives/scrnaseq2024/arrival.md
      - Launch: courseArchives/scrnaseq2024/launch.md
      - Debug: courseArchives/scrnaseq2024/debug.md
      - Output: courseArchives/scrnaseq2024/output.md
      - Loupe Browser: courseArchives/scrnaseq2024/loupe.md
    - Introduction to Workflows in the Cloud:
      - courseArchives/introCloud2024/index.md
      - Instructors: courseArchives/introCloud2024/instructors.md
      - Learning Resources: courseArchives/introCloud2024/learningResources.md
      - Arrival: courseArchives/introCloud2024/arrival.md
      - Sequin: courseArchives/introCloud2024/sequin.md
  - Blog:
    - blog/index.md
    - Tags: tags.md
theme:
  name: material
  custom_dir: overrides
  icon:
    logo: simple/mediapipe
  features:
    - announce.dismiss
    - navigation.indexes
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to Dark Mode
      primary: custom
      accent: custom
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to Light Mode
      primary: custom
      accent: custom
repo_url: https://github.com/mdibl/mdibl.github.io
plugins:
  - search
  - blog:
      blog_dir: blog
      authors: true
      authors_file: "{blog}/.authors.yml"
      post_date_format: long
      post_url_format: "{date}/{slug}"
      archive_date_format: yyyy
      post_readtime: true
      post_excerpt: required
      categories_allowed:
        - News
        - Workshops
        - Tutorials
  - tags
  - rss:
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
  - glightbox
watch:
  - includes
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [includes]
      check_paths: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      toc_depth: 3
